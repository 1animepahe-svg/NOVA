<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b7cff"/>
      <stop offset="50%" stop-color="#5c8dff"/>
      <stop offset="100%" stop-color="#5ce0ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle inner glow / shine -->
  <rect x="16" y="16" width="480" height="240" rx="112" ry="112" fill="url(#shine)" opacity="0.6"/>

  <!-- White "H" monogram -->
  <g fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical -->
    <line x1="152" y1="138" x2="152" y2="374"/>
    <!-- Right vertical -->
    <line x1="360" y1="138" x2="360" y2="374"/>
    <!-- Crossbar -->
    <line x1="152" y1="256" x2="360" y2="256"/>
  </g>

  <!-- Decorative sound-wave arcs (hark = listen) -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 220 420 Q 256 395 292 420"/>
    <path d="M 202 440 Q 256 392 310 440" opacity="0.35"/>
  </g>

  <!-- Subtle sparkle -->
  <circle cx="400" cy="120" r="10" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="120" r="18" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
</svg>
