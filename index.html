<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Personal Assistant</title>
    <meta name="description" content="A private AI assistant: chat, tasks, reminders, planner, money tracker and writing studio. Your data stays on your device." />
    <meta name="theme-color" content="#0b0a14" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Apply the saved theme before the page paints (prevents a white flash).
      try {
        var d = JSON.parse(localStorage.getItem('myassistant.data.v1') || '{}');
        var t = d && d.settings && d.settings.theme;
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
